<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en" }}" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>

    {{ if .Description }}
    <meta name="description" content="{{ .Description }}">
    {{ else if .Site.Params.description }}
    <meta name="description" content="{{ .Site.Params.description }}">
    {{ end }}

    {{- if not .IsHome -}}
    <meta property="og:title" content="{{ .Title }}">
    <meta property="og:description" content="{{ .Description | default .Site.Params.description }}">
    <meta property="og:type" content="article">
    <meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
    {{- if .Params.tags -}}
    {{- range .Params.tags }}
    <meta property="article:tag" content="{{ . }}">
    {{- end -}}
    {{- end -}}
    {{- else -}}
    <meta property="og:title" content="{{ .Site.Title }}">
    <meta property="og:description" content="{{ .Site.Params.description }}">
    <meta property="og:type" content="website">
    {{- end -}}

    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:site_name" content="{{ .Site.Title }}">
    <meta property="og:locale" content="en_US">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@cheeleong_dev">
    <meta name="twitter:creator" content="@cheeleong_dev">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/favicon.svg">

    <script>
        const _t = localStorage.getItem('theme') ||
                   (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (_t === 'dark') document.documentElement.classList.add('dark');
    </script>
    <script src="{{ "js/tailwind.js" | relURL }}"></script>
    <script type="application/ld+json">
    {{ if .IsHome }}
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Chee Leong",
        "url": "https://cheeleong.dev",
        "jobTitle": "Software Engineer",
        "description": "{{ .Site.Params.description }}",
        "sameAs": [
            "https://github.com/klrkdekira",
            "https://www.linkedin.com/in/chowcheeleong/"
        ]
    }
    {{ else }}
    {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": {{ .Title | jsonify }},
        "description": {{ .Description | default .Site.Params.description | jsonify }},
        "author": {
            "@type": "Person",
            "name": "Chee Leong",
            "url": "https://cheeleong.dev"
        },
        "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
        "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
        "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": "{{ .Permalink }}"
        },
        "publisher": {
            "@type": "Person",
            "name": "Chee Leong",
            "url": "https://cheeleong.dev"
        }
    }
    {{ end }}
    </script>

    <script type="text/tailwindcss">
        @variant dark (&:where(.dark, .dark *));
    </script>

    <style>
        .content h2 { font-size: 0.875rem; font-weight: 600; color: #374151; margin-bottom: 0.5rem; }
        .content h3 { font-size: 0.8125rem; font-weight: 500; color: #6b7280; margin-bottom: 0.375rem; }
        .content p { margin-bottom: 0.5rem; }
        .content ul { list-style: disc; padding-left: 1.25rem; margin-bottom: 0.5rem; }
        .content li { margin-bottom: 0.125rem; }
        .content hr { border-color: #e5e7eb; margin: 0.75rem 0; }
        .dark .content h2 { color: #d1d5db; }
        .dark .content h3 { color: #9ca3af; }
        .dark .content hr { border-color: #1f2937; }

        /* Accessibility */
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border-width: 0; }
        .sr-only:focus { position: static; width: auto; height: auto; padding: 1rem; margin: 1rem; overflow: visible; clip: auto; white-space: normal; border-width: 0; }
        .sr-only:focus { z-index: 50; left: 1rem; top: 1rem; background: #111827; color: #ffffff; border-radius: 0.5rem; }

        /* Visible focus for all interactive elements */
        a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; border-radius: 4px; }
        a:not(:focus-visible), button:not(:focus-visible) { outline: none; }
    </style>
</head>
<body class="h-full bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100">
    <a href="#main-content" class="sr-only">
        Skip to main content
    </a>
    {{ block "main" . }}{{ end }}

    <script>
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        document.addEventListener('DOMContentLoaded', function() {
            const toggle = document.querySelector('[data-theme-toggle]');
            if (toggle) toggle.addEventListener('click', toggleDarkMode);
        });
    </script>
</body>
</html>
