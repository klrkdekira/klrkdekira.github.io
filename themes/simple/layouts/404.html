{{ define "main" }}
<main id="main-content" class="max-w-2xl mx-auto px-6 py-16">

  <!-- Top bar -->
  <div class="flex items-start justify-between mb-12">
    <a href="{{ "/" | relURL }}" class="text-sm text-gray-400 dark:text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors">
      &larr; {{ .Site.Title }}
    </a>
    {{ partial "theme-toggle.html" . }}
  </div>

  <header class="mb-10">
    <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white mb-1">
      Page not found
    </h1>
    <p class="text-sm text-gray-500 dark:text-gray-400">
      The page you're looking for doesn't exist or has moved.
    </p>
  </header>

  <a href="{{ "/" | relURL }}" class="text-sm text-gray-600 dark:text-gray-300 underline decoration-gray-300 dark:decoration-gray-600 underline-offset-4 hover:decoration-gray-500 dark:hover:decoration-gray-400 transition-colors">
    Go to the homepage &rarr;
  </a>

</main>
{{ end }}
